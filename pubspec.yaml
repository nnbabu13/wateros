name: wateros
description: WaterOS - Complete Business Management for Small Manufacturers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Supabase
  supabase_flutter: ^2.3.0

  # UI
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_staggered_animations: ^1.1.1
  percent_indicator: ^4.2.3
  smooth_page_indicator: ^1.1.0
  gap: ^3.0.1

  # Utils
  intl: 0.20.2
  uuid: ^4.2.1
  path_provider: ^2.1.2
  url_launcher: ^6.2.2
  share_plus: ^10.0.0
  image_picker: ^1.0.7
  file_picker: ^10.0.0
  permission_handler: ^11.1.0

  # Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.12.0

  # Connectivity
  connectivity_plus: ^7.3.1

  # Icons
  cupertino_icons: ^1.0.6
  material_design_icons_flutter: ^7.0.7296

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
